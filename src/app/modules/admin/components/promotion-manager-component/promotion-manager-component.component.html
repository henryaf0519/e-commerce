<div class="max-w-4xl mx-auto space-y-6">
  <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
    <h2 class="text-lg font-bold text-gray-800 mb-6">Configurar Promoción</h2>

    <form [formGroup]="promotionForm" (ngSubmit)="savePromotion()" class="space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Promoción <span
              class="text-red-500">*</span></label>
          <input formControlName="title" type="text" class="w-full rounded-lg border-gray-300 shadow-sm p-2.5 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Código Descuento <span
              class="text-red-500">*</span></label>
          <input formControlName="code" type="text" class="w-full rounded-lg border-gray-300 shadow-sm p-2.5 border">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Inicio <span
              class="text-red-500">*</span></label>
          <input formControlName="startDate" type="date"
            class="w-full rounded-lg border-gray-300 shadow-sm p-2.5 border">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Fecha Fin <span
              class="text-red-500">*</span></label>
          <input formControlName="endDate" type="date" class="w-full rounded-lg border-gray-300 shadow-sm p-2.5 border">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Porcentaje Descuento (%) <span
            class="text-red-500">*</span></label>
        <div class="relative">
          <input formControlName="percentage" type="number"
            class="w-full rounded-lg border-gray-300 shadow-sm p-2.5 border" placeholder="Ej. 10">
          <span class="absolute right-3 top-2.5 text-gray-400">%</span>
        </div>
        <p *ngIf="promotionForm.get('percentage')?.invalid && promotionForm.get('percentage')?.touched"
          class="text-red-500 text-xs mt-1">
          Ingresa un valor entre 0 y 100
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Banner Promoción <span
            class="text-red-500">*</span></label>
        <div class="flex gap-4 items-start">
          <div *ngIf="preview"
            class="relative group aspect-video w-48 rounded-lg overflow-hidden border border-gray-200">
            <img [src]="preview" class="w-full h-full object-cover">
            <button type="button" (click)="removeFile()"
              class="absolute top-2 right-2 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
              <i class="fas fa-trash"></i>
            </button>
          </div>
          <label *ngIf="!preview"
            class="flex flex-col items-center justify-center w-48 h-28 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
            <input type="file" class="hidden" accept="image/*" (change)="onFileSelect($event)">
            <i class="fas fa-cloud-upload-alt text-gray-400 text-xl mb-2"></i>
            <span class="text-xs">Subir Banner</span>
          </label>
        </div>
      </div>

      <div class="pt-4 border-t flex justify-end">
        <button type="submit" [disabled]="promotionForm.invalid || loading"
          class="bg-indigo-600 text-white px-8 py-2.5 rounded-lg hover:bg-indigo-700 disabled:opacity-50">
          {{ loading ? 'Guardando...' : 'Guardar Promoción' }}
        </button>
      </div>
    </form>
  </div>
</div>
<div class="overflow-x-auto shadow-sm border rounded-lg">
  <table class="w-full text-sm text-left">
    <thead class="bg-gray-50 text-gray-700 uppercase text-xs">
      <tr>
        <th class="px-6 py-3">Nombre</th>
        <th class="px-6 py-3">Código</th>
        <th class="px-6 py-3">Estado</th>
        <th class="px-6 py-3 text-center">Acción</th>
      </tr>
    </thead>
    <tbody class="divide-y">
      <tr *ngFor="let promo of allPromotions" [class.bg-blue-50]="promo.isActive">
        <td class="px-6 py-4 font-medium">{{ promo.title }}</td>
        <td class="px-6 py-4 font-mono text-gray-500">{{ promo.code }}</td>

        <td class="px-6 py-4">
          <span [ngClass]="promo.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'"
            class="px-2 py-1 rounded-full text-xs font-bold">
            {{ promo.isActive ? 'ACTIVA' : 'INACTIVA' }}
          </span>
        </td>

        <td class="px-6 py-4 text-center">
          <button *ngIf="!promo.isActive && !isAnyPromotionActive" (click)="activatePromotion(promo)"
            class="text-blue-600 hover:text-blue-800 font-bold text-xs underline">
            Activar
          </button>

          <button *ngIf="promo.isActive" (click)="deactivatePromotion(promo)"
            class="text-red-600 hover:text-red-800 font-bold text-xs underline">
            Desactivar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
